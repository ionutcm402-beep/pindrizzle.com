name: One-time Local Chat timer fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one_time_local_chat_timer_fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch browser timer type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/chat/page.tsx')
          text = path.read_text()
          old = 'let refreshTimer: ReturnType<typeof window.setTimeout> | null = null;'
          new = 'let refreshTimer: number | null = null;'
          if old not in text:
              raise SystemExit('Expected Local Chat timer declaration was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact fix to main
        run: |
          git config user.name "pindrizzle-build-fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/chat/page.tsx
          git commit -m "Fix Local Chat browser timer type"
          git push origin HEAD:main
